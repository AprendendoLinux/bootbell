name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Testes (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.6", "3.8", "3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Testes unitários
        run: >
          docker run --rm -v "$PWD":/src:ro -w /src python:${{ matrix.python }}-slim
          python3 -m unittest discover -s tests -v

  build:
    name: Gerar o .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        run: ./build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  install:
    name: Instalar em ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:18.04
          - ubuntu:20.04
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:10
          - debian:11
          - debian:12
          - debian:13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist
      - name: Instalar, testar e remover
        run: docker run --rm -v "$PWD":/src -w /src ${{ matrix.image }} sh tests/install-test.sh

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist
      - name: Criar a release com o .deb
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum *.deb > SHA256SUMS
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on && /^\[/ {exit}
            on {print}
          ' ../CHANGELOG.md > notes.md
          cat >> notes.md <<NOTES

          ## Instalação

          \`\`\`bash
          wget https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/bootbell_${VERSION}_all.deb
          sudo apt install ./bootbell_${VERSION}_all.deb
          \`\`\`

          Depois, siga a [configuração no README](https://github.com/${GITHUB_REPOSITORY}#configuração).
          NOTES
          gh release create "$TAG" *.deb SHA256SUMS --title "bootbell $VERSION" --notes-file notes.md
