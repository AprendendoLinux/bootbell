# Configuração do bootbell
# ========================
#
# Depois de editar, valide com:     sudo bootbell check
# e envie uma mensagem de teste:    sudo bootbell test
#
# Este arquivo contém o token do seu bot: mantenha-o com permissão 640
# (dono root, grupo bootbell). O pacote já instala assim.
#
# Valores booleanos aceitam: yes/no, true/false, on/off, 1/0.

[telegram]
# Token do bot, obtido com o @BotFather no Telegram (formato 123456:ABC-DEF...).
token =

# ID do chat que vai receber os avisos. Para descobrir o seu, mande uma
# mensagem para o bot e abra https://api.telegram.org/bot<TOKEN>/getUpdates
# (procure por "chat":{"id":...}). Para grupos, o ID começa com "-".
chat_id =

# Envia as mensagens sem som de notificação.
silent = no

# Endereço da Bot API. Só mude se usar um servidor próprio da Bot API.
#api_url = https://api.telegram.org


[general]
# Nome do computador nas mensagens. Vazio = usa o hostname do sistema.
hostname =

# Formatos de data e hora (códigos do strftime).
date_format = %d/%m/%Y
time_format = %H:%M:%S

# Interfaces cujos IPs não aparecem nas mensagens (padrões separados por
# espaço, aceitam * e ?). Loopback e endereços link-local (fe80::) já são
# sempre ignorados.
ignore_interfaces = docker* veth* br-* virbr* lxcbr* lxdbr*

# Usa somente IPv4 para falar com o Telegram (útil se o IPv6 da rede é ruim).
ipv4_only = no

# Tempo máximo (segundos) de cada tentativa de envio.
request_timeout = 10

# No boot, por quanto tempo (segundos) continuar tentando enviar caso a
# rede ainda não esteja funcionando. O boot NÃO fica esperando por isso.
boot_retry_for = 300

# No boot, por quanto tempo (segundos) esperar um endereço IPv4 aparecer
# antes de montar o aviso de "ligado". A rede pode ser dada como pronta
# antes do DHCP terminar (ex.: IPv6 fixo + IPv4 por DHCP), e o aviso sairia
# sem o IPv4. Só o aviso espera, o boot não. 0 = não esperar (use em
# máquinas somente IPv6).
ip_wait = 60

# No desligamento, tempo máximo (segundos) gasto tentando enviar o aviso.
# Deve ser menor que TimeoutStopSec da unit (30s). Se não der tempo, o
# aviso é guardado e enviado no próximo boot.
shutdown_timeout = 20


[messages]
# Modelos das mensagens. Use \n para quebrar linha. Campos disponíveis:
#   {host}       nome do computador
#   {date}       data atual            {time}   hora atual
#   {uptime}     tempo ligado (ex.: "2 dias, 3 horas e 5 minutos")
#   {ips}        endereços IP, um por linha
#   {action}     REINICIAR ou DESLIGAR (somente em "shutdown")
#   {last_boot}  início da sessão interrompida (somente em "unclean")
#   {version}    versão do bootbell
#
# Descomente uma linha para personalizar; as que ficarem comentadas usam
# o texto padrão mostrado.

# Computador ligou.
#boot = 🟢 O computador {host} foi LIGADO em {date} às {time}.\n\nEndereços IP:\n{ips}

# Computador vai desligar ou reiniciar.
#shutdown = 🔴 O computador {host} vai {action} em {date} às {time}.\nFicou ligado por {uptime}.

# Detectado no boot: a sessão anterior terminou sem desligamento normal.
#unclean = ⚠️ O computador {host} NÃO foi desligado corretamente.\nA sessão iniciada em {last_boot} terminou sem um desligamento normal (queda de energia, travamento ou desligamento forçado).

# Serviço iniciado manualmente (ex.: logo após instalar o pacote).
#started = ▶️ Monitoramento do bootbell ATIVADO no computador {host} em {date} às {time}.\nO computador está ligado há {uptime}.\n\nEndereços IP:\n{ips}

# Serviço parado manualmente (ex.: systemctl stop bootbell ou remoção do pacote).
#stopped = ⏸️ Monitoramento do bootbell DESATIVADO no computador {host} em {date} às {time}.\nO computador continua ligado (há {uptime}).

# Mensagem do comando "bootbell test".
#test = 🔔 Teste do bootbell no computador {host} em {date} às {time}: as notificações estão funcionando!

# Nota acrescentada a mensagens que ficaram na fila e foram enviadas depois.
#delayed = 📨 Esta mensagem não pôde ser enviada na hora e foi entregue com atraso.
